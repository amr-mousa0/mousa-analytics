backend:
  name: github
  repo: amr-mousa0/mousa-analytics
  branch: main
  base_url: "https://mousa-analytics.vercel.app"
  auth_endpoint: "api/auth"


# Enable Local development mode (runs with npx decap-cms-proxy-server)
local_backend: true

# Enable Editorial Workflow in production for draft reviews, approvals, and preview builds
publish_mode: editorial_workflow

# Media configuration to work natively with Astro Image Sharp pipeline
media_folder: "src/assets/images/uploads"
public_folder: "../../../assets/images/uploads"
max_file_size: 5000000 # 5MB limit


# DRY (Don't Repeat Yourself) YAML Anchors for shared fields
seo_fields: &seo_fields
  name: seo
  label: SEO & Metadata
  widget: object
  required: true
  fields:
    - { label: "Meta Title", name: "metaTitle", widget: "string", required: true, hint: "Search result title (60 chars max)" }
    - { label: "Meta Description", name: "metaDescription", widget: "string", required: true, hint: "Search description snippet (160 chars max)" }
    - { label: "OG Image (Social)", name: "ogImage", widget: "image", required: false, hint: "Custom sharing thumbnail card" }
    - { label: "Canonical URL", name: "canonicalUrl", widget: "string", required: false }
    - { label: "No Index", name: "noindex", widget: "boolean", default: false, hint: "Exclude page from search indexes" }

collections:
  # 1. Services (English)
  - name: "services_en"
    label: "Services (English)"
    folder: "src/content/services/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Slug", name: "slug", widget: "slug", readonly: true, required: true, hint: "Read-only after creation to prevent broken routes." }
      - { label: "Description (Teaser)", name: "description", widget: "text", required: true }
      - { label: "Icon Name", name: "icon", widget: "string", required: true, hint: "Lucide icon key (e.g. table, database)" }
      - { label: "Priority (Order)", name: "priority", widget: "number", value_type: "int", required: true }
      - { label: "Category", name: "category", widget: "select", options: ["Data Analytics", "Digital Marketing", "Systems Automation", "Web Development"], required: true }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      
      # Detailed Proposal Fields
      - { label: "Executive Summary Text", name: "execSummaryText", widget: "text", required: true }
      - { label: "Scope Section Title", name: "scopeTitle", widget: "string", required: false, default: "What I Will Do (Scope of Work)" }
      - label: "Scope of Work Items"
        name: "scopeItems"
        widget: "list"
        required: false
        fields:
          - { label: "Item Title", name: "title", widget: "string", required: true }
          - { label: "Item Description", name: "desc", widget: "text", required: true }
      - { label: "Deliverables Section Title", name: "deliverablesTitle", widget: "string", required: false, default: "What You Will Get (Business ROI & Deliverables)" }
      - label: "Deliverables List"
        name: "deliverablesItems"
        widget: "list"
        required: false
        field: { label: "Deliverable Point", name: "item", widget: "string" }
      - { label: "CTA Section Title", name: "ctaTitle", widget: "string", required: false, default: "Accept Proposal & Start Project" }
      - { label: "CTA Description", name: "ctaDesc", widget: "text", required: false }
      - { label: "CTA Button Text", name: "ctaBtn", widget: "string", required: false, default: "Accept Proposal & Start Project" }
      - { label: "WhatsApp Message Text", name: "whatsappMessage", widget: "string", required: false }
      - { label: "FAQ Section Title", name: "faqTitle", widget: "string", required: false, default: "Frequently Asked Questions" }
      - label: "FAQ Items"
        name: "faqItems"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "q", widget: "string", required: true }
          - { label: "Answer", name: "a", widget: "text", required: true }

      # Content States
      - { label: "Draft", name: "draft", widget: "boolean", default: false, hint: "If checked, hidden from public builds" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "If checked, pinned at top of lists" }
      - { label: "Publish Date", name: "publishedDate", widget: "datetime", required: true }
      - { label: "Translation Linking Key", name: "translationKey", widget: "string", required: true, hint: "Unique key matching EN/AR versions (e.g. coffee-shop)" }
      - *seo_fields

  # 2. Services (Arabic)
  - name: "services_ar"
    label: "الخدمات (العربية)"
    folder: "src/content/services/ar"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "العنوان", name: "title", widget: "string", required: true }
      - { label: "الرابط البديل (Slug)", name: "slug", widget: "slug", readonly: true, required: true }
      - { label: "الوصف القصير", name: "description", widget: "text", required: true }
      - { label: "اسم الأيقونة", name: "icon", widget: "string", required: true, hint: "اسم أيقونة Lucide (مثل table)" }
      - { label: "الأولوية (الترتيب)", name: "priority", widget: "number", value_type: "int", required: true }
      - { label: "التصنيف", name: "category", widget: "select", options: ["Data Analytics", "Digital Marketing", "Systems Automation", "Web Development"], required: true }
      - { label: "الوسوم (Tags)", name: "tags", widget: "list", required: false }
      - { label: "صورة الغلاف", name: "coverImage", widget: "image", required: false }

      # Detailed Proposal Fields (Arabic UI)
      - { label: "نص الملخص التنفيذي", name: "execSummaryText", widget: "text", required: true }
      - { label: "عنوان قسم نطاق العمل", name: "scopeTitle", widget: "string", required: false, default: "ما سأقوم به (نطاق العمل)" }
      - label: "عناصر نطاق العمل"
        name: "scopeItems"
        widget: "list"
        required: false
        fields:
          - { label: "عنوان العنصر", name: "title", widget: "string", required: true }
          - { label: "وصف العنصر", name: "desc", widget: "text", required: true }
      - { label: "عنوان قسم المخرجات", name: "deliverablesTitle", widget: "string", required: false, default: "ما ستحصل عليه (العائد والنتائج)" }
      - label: "قائمة المخرجات"
        name: "deliverablesItems"
        widget: "list"
        required: false
        field: { label: "بند المخرجات", name: "item", widget: "string" }
      - { label: "عنوان قسم دعوة العمل (CTA)", name: "ctaTitle", widget: "string", required: false, default: "قبول المقترح وبدء المشروع" }
      - { label: "وصف دعوة العمل", name: "ctaDesc", widget: "text", required: false }
      - { label: "نص زر دعوة العمل", name: "ctaBtn", widget: "string", required: false, default: "الموافقة على المقترح والبدء الآن" }
      - { label: "نص رسالة الواتساب", name: "whatsappMessage", widget: "string", required: false }
      - { label: "عنوان قسم الأسئلة الشائعة", name: "faqTitle", widget: "string", required: false, default: "الأسئلة الشائعة حول الخدمة" }
      - label: "الأسئلة الشائعة"
        name: "faqItems"
        widget: "list"
        required: false
        fields:
          - { label: "السؤال", name: "q", widget: "string", required: true }
          - { label: "الإجابة", name: "a", widget: "text", required: true }

      # Content States (Arabic UI)
      - { label: "مسودة (Draft)", name: "draft", widget: "boolean", default: false, hint: "إخفاء من الموقع في وضع الإنتاج" }
      - { label: "مميز (Featured)", name: "featured", widget: "boolean", default: false, hint: "تثبيت في أعلى القوائم" }
      - { label: "تاريخ النشر", name: "publishedDate", widget: "datetime", required: true }
      - { label: "مفتاح الربط للترجمة", name: "translationKey", widget: "string", required: true, hint: "مفتاح فريد يطابق النسخة الإنجليزية (مثل coffee-shop)" }
      - *seo_fields

  # 3. Projects (English)
  - name: "projects_en"
    label: "Projects (English)"
    folder: "src/content/projects/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Slug", name: "slug", widget: "slug", readonly: true, required: true }
      - { label: "Project Badge/Category", name: "projectBadge", widget: "string", required: true, hint: "Uppercase badge (e.g. DATA ANALYTICS & BI)" }
      - { label: "Problem Section Title", name: "problemTitle", widget: "string", required: true, default: "The Problem" }
      - { label: "Problem Text Details", name: "problemText", widget: "text", required: true }
      - { label: "Solution Section Title", name: "solutionTitle", widget: "string", required: true, default: "The Solution & Value" }
      - { label: "Solution Text Details", name: "solutionText", widget: "text", required: true }
      - { label: "Impact Section Title", name: "impactTitle", widget: "string", required: true, default: "Sales Funnel Impact" }
      - { label: "Impact Text Details", name: "impactText", widget: "text", required: true }
      - { label: "Gallery Tab Label", name: "galleryTab", widget: "string", required: true, default: "Project Gallery" }
      - { label: "Dashboard Tab Label", name: "dashboardTab", widget: "string", required: true, default: "Live Interactive Dashboard" }
      - { label: "Dashboard Prompt", name: "dashboardPrompt", widget: "string", required: true }
      - { label: "Dashboard Request Button", name: "dashboardBtn", widget: "string", required: true }
      - { label: "Inquire Title", name: "inquireTitle", widget: "string", required: true }
      - { label: "Inquire Description", name: "inquireDesc", widget: "string", required: true }
      - { label: "Inquire Button CTA", name: "inquireBtn", widget: "string", required: true }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: true }
      - { label: "Gallery Images list", name: "galleryImages", widget: "list", field: { name: "image", widget: "image" }, required: true }
      - { label: "Github URL", name: "githubUrl", widget: "string", required: false }
      - { label: "WhatsApp Start Project Message", name: "whatsappStartProjectMsg", widget: "string", required: true }
      - { label: "WhatsApp Open Dashboard Message", name: "whatsappOpenDashboardMsg", widget: "string", required: true }
      - { label: "Priority (Order)", name: "priority", widget: "number", value_type: "int", required: true }
      - { label: "Category", name: "category", widget: "select", options: ["Data Analytics", "Digital Marketing", "Systems Automation", "Web Development"], required: true }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      # Content States
      - { label: "Draft", name: "draft", widget: "boolean", default: false, hint: "If checked, hidden from public builds" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "If checked, pinned at top of lists" }
      - { label: "Publish Date", name: "publishedDate", widget: "datetime", required: true }
      - { label: "Translation Linking Key", name: "translationKey", widget: "string", required: true, hint: "Unique key matching EN/AR versions (e.g. coffee-shop)" }
      - *seo_fields

  # 4. Projects (Arabic)
  - name: "projects_ar"
    label: "المشاريع (العربية)"
    folder: "src/content/projects/ar"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "العنوان", name: "title", widget: "string", required: true }
      - { label: "الرابط البديل (Slug)", name: "slug", widget: "slug", readonly: true, required: true }
      - { label: "شارة المشروع", name: "projectBadge", widget: "string", required: true }
      - { label: "عنوان قسم المشكلة", name: "problemTitle", widget: "string", required: true, default: "المشكلة" }
      - { label: "تفاصيل المشكلة", name: "problemText", widget: "text", required: true }
      - { label: "عنوان قسم الحل والقيمة", name: "solutionTitle", widget: "string", required: true, default: "الحل والقيمة المضافة" }
      - { label: "تفاصيل الحل والقيمة", name: "solutionText", widget: "text", required: true }
      - { label: "عنوان قسم الأثر والنتائج", name: "impactTitle", widget: "string", required: true, default: "الأثر والنتائج" }
      - { label: "تفاصيل الأثر والنتائج", name: "impactText", widget: "text", required: true }
      - { label: "تسمية تبويب المعرض", name: "galleryTab", widget: "string", required: true, default: "معرض صور المشروع" }
      - { label: "تسمية تبويب لوحة البيانات", name: "dashboardTab", widget: "string", required: true, default: "لوحة البيانات التفاعلية" }
      - { label: "نص التوجيه للوحة البيانات", name: "dashboardPrompt", widget: "string", required: true }
      - { label: "زر فتح لوحة البيانات", name: "dashboardBtn", widget: "string", required: true }
      - { label: "عنوان الاستفسار", name: "inquireTitle", widget: "string", required: true }
      - { label: "وصف الاستفسار", name: "inquireDesc", widget: "string", required: true }
      - { label: "زر استفسار (CTA)", name: "inquireBtn", widget: "string", required: true }
      - { label: "صورة الغلاف", name: "coverImage", widget: "image", required: true }
      - { label: "صور المعرض", name: "galleryImages", widget: "list", field: { name: "image", widget: "image" }, required: true }
      - { label: "رابط مستودع Github", name: "githubUrl", widget: "string", required: false }
      - { label: "رسالة واتساب لبدء المشروع", name: "whatsappStartProjectMsg", widget: "string", required: true }
      - { label: "رسالة واتساب لفتح لوحة المؤشرات", name: "whatsappOpenDashboardMsg", widget: "string", required: true }
      - { label: "الأولوية (الترتيب)", name: "priority", widget: "number", value_type: "int", required: true }
      - { label: "التصنيف", name: "category", widget: "select", options: ["Data Analytics", "Digital Marketing", "Systems Automation", "Web Development"], required: true }
      - { label: "الوسوم (Tags)", name: "tags", widget: "list", required: false }
      # Content States (Arabic UI)
      - { label: "مسودة (Draft)", name: "draft", widget: "boolean", default: false, hint: "إخفاء من الموقع في وضع الإنتاج" }
      - { label: "مميز (Featured)", name: "featured", widget: "boolean", default: false, hint: "تثبيت في أعلى القوائم" }
      - { label: "تاريخ النشر", name: "publishedDate", widget: "datetime", required: true }
      - { label: "مفتاح الربط للترجمة", name: "translationKey", widget: "string", required: true, hint: "مفتاح فريد يطابق النسخة الإنجليزية (مثل coffee-shop)" }
      - *seo_fields

  # 5. Blog (English)
  - name: "blog_en"
    label: "Blog Posts (English)"
    folder: "src/content/blog/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true, hint: "Article Title (60 chars max)" }
      - { label: "Description", name: "description", widget: "text", required: true, hint: "Article Teaser Description (160 chars max)" }
      - { label: "Publish Date", name: "publishDate", widget: "datetime", required: true }
      - { label: "Updated Date", name: "updatedDate", widget: "datetime", required: false }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - { label: "Author", name: "author", widget: "string", default: "Amr Mousa", required: true }
      - { label: "Category", name: "category", widget: "select", options: ["Data Analytics", "Digital Marketing", "Systems Automation", "Web Development"], required: true }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Translation Linking Key", name: "translationKey", widget: "string", required: true, hint: "Unique key matching EN/AR versions (e.g., intro-to-analytics)" }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - *seo_fields
      - { label: "Body", name: "body", widget: "markdown", required: true }

  # 6. Blog (Arabic)
  - name: "blog_ar"
    label: "المقالات (العربية)"
    folder: "src/content/blog/ar"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "العنوان", name: "title", widget: "string", required: true, hint: "عنوان المقال (أقصى 60 حرف)" }
      - { label: "الوصف", name: "description", widget: "text", required: true, hint: "وصف مختصر للمقال (أقصى 160 حرف)" }
      - { label: "تاريخ النشر", name: "publishDate", widget: "datetime", required: true }
      - { label: "تاريخ التحديث", name: "updatedDate", widget: "datetime", required: false }
      - { label: "صورة الغلاف", name: "coverImage", widget: "image", required: false }
      - { label: "الكاتب", name: "author", widget: "string", default: "عمرو موسى", required: true }
      - { label: "التصنيف", name: "category", widget: "select", options: ["Data Analytics", "Digital Marketing", "Systems Automation", "Web Development"], required: true }
      - { label: "الوسوم (Tags)", name: "tags", widget: "list", required: false }
      - { label: "مفتاح الربط للترجمة", name: "translationKey", widget: "string", required: true, hint: "مفتاح فريد يطابق النسخة الإنجليزية" }
      - { label: "مسودة (Draft)", name: "draft", widget: "boolean", default: true }
      - *seo_fields
      - { label: "المحتوى", name: "body", widget: "markdown", required: true }

  # 7. Hero Section Settings
  - name: "hero"
    label: "Hero Section Settings"
    delete: false
    files:
      - name: "hero_en"
        label: "Hero Section (English)"
        file: "src/content/hero/en.md"
        fields:
          - { label: "Title", name: "title", widget: "string", required: true }
          - { label: "Bio (Subtitle)", name: "bio", widget: "text", required: true }
          - { label: "Primary Button Text", name: "primaryBtn", widget: "string", required: true }
          - { label: "Secondary Button Text", name: "secondaryBtn", widget: "string", required: true }
          - { label: "Trending Label", name: "trendingLabel", widget: "string", required: true }
          - { label: "Trending Items", name: "trendingItems", widget: "string", required: true }
      - name: "hero_ar"
        label: "قسم الهيرو (العربية)"
        file: "src/content/hero/ar.md"
        fields:
          - { label: "العنوان الرئيسي", name: "title", widget: "string", required: true }
          - { label: "الوصف التعريفي (Bio)", name: "bio", widget: "text", required: true }
          - { label: "نص الزر الرئيسي", name: "primaryBtn", widget: "string", required: true }
          - { label: "نص الزر الفرعي", name: "secondaryBtn", widget: "string", required: true }
          - { label: "تسمية الضمانات/الروابط", name: "trendingLabel", widget: "string", required: true }
          - { label: "عناصر الضمانات", name: "trendingItems", widget: "string", required: true }

  # 8. Social Links (English)
  - name: "socials_en"
    label: "Social Links (English)"
    folder: "src/content/socials/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string", required: true }
      - { label: "URL", name: "url", widget: "string", required: true }
      - { label: "FontAwesome Icon Class", name: "icon", widget: "string", required: true, hint: "e.g. fa-brands fa-github" }
      - { label: "Priority (Order)", name: "priority", widget: "number", value_type: "int", required: true }

  # 9. Social Links (Arabic)
  - name: "socials_ar"
    label: "روابط التواصل (العربية)"
    folder: "src/content/socials/ar"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "الاسم", name: "name", widget: "string", required: true }
      - { label: "الرابط", name: "url", widget: "string", required: true }
      - { label: "كلاس أيقونة FontAwesome", name: "icon", widget: "string", required: true, hint: "مثال: fa-brands fa-github" }
      - { label: "الأولوية (الترتيب)", name: "priority", widget: "number", value_type: "int", required: true }

  # 10. Page SEO & Metadata (English)
  - name: "seo_en"
    label: "Page SEO & Metadata (English)"
    folder: "src/content/seo/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Meta Title", name: "title", widget: "string", required: true, hint: "Search result title (60 chars max)" }
      - { label: "Meta Description", name: "description", widget: "text", required: true, hint: "Search snippet (160 chars max)" }
      - { label: "Keywords", name: "keywords", widget: "list", required: false }
      - { label: "OG Image (Social Share)", name: "ogImage", widget: "image", required: false }

  # 11. Page SEO & Metadata (Arabic)
  - name: "seo_ar"
    label: "تهيئة محركات البحث (العربية)"
    folder: "src/content/seo/ar"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "العنوان التعريفي (Meta Title)", name: "title", widget: "string", required: true, hint: "العنوان في نتائج البحث (أقصى 60 حرف)" }
      - { label: "الوصف التعريفي (Meta Description)", name: "description", widget: "text", required: true, hint: "الوصف في نتائج البحث (أقصى 160 حرف)" }
      - { label: "الكلمات المفتاحية (Keywords)", name: "keywords", widget: "list", required: false }
      - { label: "صورة المشاركة الاجتماعية (OG Image)", name: "ogImage", widget: "image", required: false }
