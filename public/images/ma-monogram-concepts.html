<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Identity — M Monogram</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600&display=swap');

    :root {
      --bg: #F8F9FA;
      --text: #0A192F;
      --card-bg: #FFFFFF;
      --primary: #2563EB;
      --accent: #64FFDA;
      --border: rgba(10, 25, 47, 0.08);
      --shadow: 0 12px 40px rgba(10, 25, 47, 0.04);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 100px 24px;
      line-height: 1.6;
    }

    .badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(3rem, 6vw, 4.5rem);
      font-weight: 700;
      line-height: 1.1;
      color: var(--text);
      text-align: center;
      margin-bottom: 24px;
    }

    .sub {
      text-align: center;
      font-size: 1.125rem;
      color: rgba(10, 25, 47, 0.6);
      max-width: 600px;
      margin-inline: auto;
      margin-bottom: 80px;
      font-weight: 300;
    }

    .showcase {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 80px 64px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 900px;
      width: 100%;
    }

    .logo-hero {
      width: 380px;
      height: 380px;
      margin-bottom: 64px;
    }

    .logo-hero svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 20px 30px rgba(37, 99, 235, 0.15));
    }

    .caption {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.75rem;
      font-style: italic;
      color: var(--text);
      text-align: center;
      max-width: 600px;
      line-height: 1.4;
      padding-bottom: 64px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 64px;
    }

    .sizes-grid {
      display: flex;
      align-items: flex-end;
      gap: 64px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .sizes-grid > div {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .sizes-grid span {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: rgba(10, 25, 47, 0.4);
      font-weight: 500;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <span class="badge">Brand Identity</span>
  <h1>The Monogram</h1>
  <p class="sub">Precision data architecture mapped into a unified corporate mark. The twin pillars represent structured scaling, anchored by a conversion trendline.</p>

            fill="url(#primary-grad)" />

          <!-- Trend Line -->
          <path d="M 19.80,48.50 L 53.98,43.00 L 82.82,43.00" stroke="#2563EB" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" />
          <circle cx="19.80" cy="48.50" r="3" fill="#38BDF8" />
          <circle cx="53.98" cy="43.00" r="3" fill="#38BDF8" />
          <circle cx="82.82" cy="43.00" r="3" fill="#38BDF8" />
        </g>
      </svg>
    </div>

    <p class="caption">"Structural layering and high-contrast precision. A mark designed for executive trust."</p>
