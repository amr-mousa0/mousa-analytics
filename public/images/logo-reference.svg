<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64FFDA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- 1. Background Grid: Clean financial/analytics grid lines -->
  <g stroke="#2563EB" stroke-width="0.25" opacity="0.12">
    <!-- Vertical grid lines -->
    <line x1="10" y1="10" x2="10" y2="90" />
    <line x1="20" y1="10" x2="20" y2="90" />
    <line x1="30" y1="10" x2="30" y2="90" />
    <line x1="40" y1="10" x2="40" y2="90" />
    <line x1="50" y1="10" x2="50" y2="90" />
    <line x1="60" y1="10" x2="60" y2="90" />
    <line x1="70" y1="10" x2="70" y2="90" />
    <line x1="80" y1="10" x2="80" y2="90" />
    <line x1="90" y1="10" x2="90" y2="90" />
    <!-- Horizontal grid lines -->
    <line x1="10" y1="10" x2="90" y2="10" />
    <line x1="10" y1="20" x2="90" y2="20" />
    <line x1="10" y1="30" x2="90" y2="30" />
    <line x1="10" y1="40" x2="90" y2="40" />
    <line x1="10" y1="50" x2="90" y2="50" />
    <line x1="10" y1="60" x2="90" y2="60" />
    <line x1="10" y1="70" x2="90" y2="70" />
    <line x1="10" y1="80" x2="90" y2="80" />
    <line x1="10" y1="90" x2="90" y2="90" />
  </g>

  <!-- 2. Solid X and Y Axes with Arrowheads and Ticks -->
  <g stroke="#2563EB" stroke-width="0.8" opacity="0.45" stroke-linecap="round">
    <!-- Y-Axis (Left Border line extending up) -->
    <line x1="10" y1="90" x2="10" y2="5" />
    <!-- Y-Axis Arrowhead pointing UP -->
    <path d="M 8.5,7.5 L 10,5 L 11.5,7.5" fill="none" />

    <!-- X-Axis (Bottom Border line extending right) -->
    <line x1="10" y1="90" x2="95" y2="90" />
    <!-- X-Axis Arrowhead pointing RIGHT -->
    <path d="M 92.5,88.5 L 95,90 L 92.5,91.5" fill="none" />
  </g>

  <!-- 3. Tick Marks and Labels -->
  <g fill="#8F9BB7" font-family="'Outfit', sans-serif" font-size="2.2" text-anchor="end" opacity="0.6">
    <!-- Y Ticks & Labels -->
    <line x1="8" y1="10" x2="10" y2="10" stroke="#2563EB" stroke-width="0.6" opacity="0.45" />
    <text x="6.5" y="10.8">1.0</text>
    <line x1="8" y1="30" x2="10" y2="30" stroke="#2563EB" stroke-width="0.6" opacity="0.45" />
    <text x="6.5" y="30.8">0.8</text>
    <line x1="8" y1="50" x2="10" y2="50" stroke="#2563EB" stroke-width="0.6" opacity="0.45" />
    <text x="6.5" y="50.8">0.5</text>
    <line x1="8" y1="70" x2="10" y2="70" stroke="#2563EB" stroke-width="0.6" opacity="0.45" />
    <text x="6.5" y="70.8">0.3</text>
    <line x1="8" y1="90" x2="10" y2="90" stroke="#2563EB" stroke-width="0.6" opacity="0.45" />
    <text x="6.5" y="90.8">0.0</text>
    
    <!-- X Ticks & Labels -->
    <line x1="25.04" y1="90" x2="25.04" y2="92" stroke="#2563EB" stroke-width="0.6" opacity="0.45" />
    <text x="25.04" y="95.5" text-anchor="middle">t₀</text>
    <line x1="44.80" y1="90" x2="44.80" y2="92" stroke="#2563EB" stroke-width="0.6" opacity="0.45" />
    <text x="44.80" y="95.5" text-anchor="middle">t₁</text>
    <line x1="68.00" y1="90" x2="68.00" y2="92" stroke="#2563EB" stroke-width="0.6" opacity="0.45" />
    <text x="68.00" y="95.5" text-anchor="middle">t₂</text>
  </g>

  <!-- Middle Layer: Logo shapes and Trend Line (Scaled and centered to give breathing room from axes) -->
  <g transform="translate(9.2, 16.5) scale(0.8)">
    <!-- Shape 0: Smooth Left Dot -->
    <path d="M 21.5,59.5 C 16.5,59.5 13.0,55.0 12.0,49.0 C 11.0,43.0 14.0,37.0 18.0,37.5 C 22.0,38.0 25.0,44.0 27.5,48.0 C 30.0,52.0 26.5,59.5 21.5,59.5 Z" fill="url(#grad-accent)" />

    <!-- Shape 1: Smooth Middle Pillar -->
    <path d="M 52.38,59.37 C 48.00,59.37 45.00,57.50 44.50,55.95 L 28.44,22.34 C 26.80,21.00 24.72,21.00 23.09,21.75 C 26.00,14.50 29.50,10.00 32.16,10.00 C 34.83,10.00 37.00,11.00 38.85,12.23 L 56.10,47.32 C 58.00,48.36 60.00,48.36 61.15,47.62 C 58.00,56.00 55.00,59.37 52.38,59.37 Z" fill="url(#grad-primary)" />

    <!-- Shape 2: Smooth Right Pillar -->
    <path d="M 81.22,59.37 C 76.84,59.37 73.84,57.50 73.34,55.95 L 57.28,22.34 C 55.64,21.00 53.56,21.00 51.93,21.75 C 54.84,14.50 58.34,10.00 61.00,10.00 C 63.67,10.00 65.84,11.00 67.69,12.23 L 84.94,47.32 C 86.84,48.36 88.84,48.36 89.99,47.62 C 86.84,56.00 83.84,59.37 81.22,59.37 Z" fill="url(#grad-primary)" />

    <!-- Foreground Layer: Continuous Rising Trend Line -->
    <path d="M 19.80,48.50 L 44.50,35.00 L 73.50,35.00" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95" />
    
    <!-- Nodes -->
    <circle cx="19.80" cy="48.50" r="2.2" fill="#64FFDA" />
    <circle cx="44.50" cy="35.00" r="2.2" fill="#FFFFFF" />
    <circle cx="73.50" cy="35.00" r="2.2" fill="#64FFDA" />
  </g>
</svg>
